<!-- Branchy - Yellow State (Warning/Pending) -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Glow effect -->
  <defs>
    <filter id="yellowGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="yellowGradient">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Body (Tree Trunk) - Cautious -->
  <ellipse cx="100" cy="120" rx="35" ry="45" fill="url(#yellowGradient)" stroke="#D68910" stroke-width="2"/>
  
  <!-- Branch 1 (Top Left) - Slightly drooped -->
  <path d="M 75 95 Q 48 82 38 65" stroke="#E67E22" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="38" cy="65" r="9" fill="#F39C12" opacity="0.8"/>
  
  <!-- Branch 2 (Top Right) - Slightly drooped -->
  <path d="M 125 95 Q 152 82 162 65" stroke="#E67E22" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="162" cy="65" r="9" fill="#F39C12" opacity="0.8"/>
  
  <!-- Branch 3 (Middle Left) -->
  <path d="M 70 110 Q 38 107 23 103" stroke="#E67E22" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="23" cy="103" r="7" fill="#F39C12" opacity="0.8"/>
  
  <!-- Branch 4 (Middle Right) -->
  <path d="M 130 110 Q 162 107 177 103" stroke="#E67E22" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="177" cy="103" r="7" fill="#F39C12" opacity="0.8"/>
  
  <!-- Branch 5 (Bottom) -->
  <path d="M 100 155 Q 100 177 100 187" stroke="#E67E22" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="100" cy="187" r="7" fill="#F39C12" opacity="0.8"/>
  
  <!-- Face - Thoughtful/Concerned -->
  <!-- Eyes - One squinting -->
  <circle cx="90" cy="115" r="5" fill="#7D4E1C"/>
  <!-- Squinted eye -->
  <path d="M 105 115 Q 110 113 115 115" stroke="#7D4E1C" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Eye shine -->
  <circle cx="92" cy="113" r="2" fill="#FFFFFF"/>
  
  <!-- Uncertain expression -->
  <path d="M 85 132 Q 95 135 105 133" stroke="#7D4E1C" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Warning symbol above head -->
  <g transform="translate(100, 50)">
    <polygon points="0,-12 10,8 -10,8" fill="#F39C12" stroke="#E67E22" stroke-width="2" filter="url(#yellowGlow)">
      <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
    </polygon>
    <text x="0" y="4" text-anchor="middle" font-size="14" font-weight="bold" fill="#7D4E1C">!</text>
  </g>
  
  <!-- Ground shadow -->
  <ellipse cx="100" cy="195" rx="40" ry="5" fill="rgba(243,156,18,0.2)"/>
</svg>
