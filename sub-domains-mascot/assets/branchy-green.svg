<!-- Branchy - Green State (Active/Healthy) -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Glow effect -->
  <defs>
    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="greenGradient">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Body (Tree Trunk) - Vibrant -->
  <ellipse cx="100" cy="120" rx="35" ry="45" fill="url(#greenGradient)" stroke="#229954" stroke-width="2"/>
  
  <!-- Branch 1 (Top Left) - Extended -->
  <path d="M 75 95 Q 45 75 35 55" stroke="#27AE60" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#greenGlow)"/>
  <circle cx="35" cy="55" r="10" fill="#2ECC71" filter="url(#greenGlow)"/>
  
  <!-- Branch 2 (Top Right) - Extended -->
  <path d="M 125 95 Q 155 75 165 55" stroke="#27AE60" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#greenGlow)"/>
  <circle cx="165" cy="55" r="10" fill="#2ECC71" filter="url(#greenGlow)"/>
  
  <!-- Branch 3 (Middle Left) - Extended -->
  <path d="M 70 110 Q 35 105 20 100" stroke="#27AE60" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#greenGlow)"/>
  <circle cx="20" cy="100" r="8" fill="#2ECC71" filter="url(#greenGlow)"/>
  
  <!-- Branch 4 (Middle Right) - Extended -->
  <path d="M 130 110 Q 165 105 180 100" stroke="#27AE60" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#greenGlow)"/>
  <circle cx="180" cy="100" r="8" fill="#2ECC71" filter="url(#greenGlow)"/>
  
  <!-- Branch 5 (Bottom) - Extended -->
  <path d="M 100 155 Q 100 180 100 190" stroke="#27AE60" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#greenGlow)"/>
  <circle cx="100" cy="190" r="8" fill="#2ECC71" filter="url(#greenGlow)"/>
  
  <!-- Face - Happy -->
  <!-- Eyes - Wide and bright -->
  <circle cx="90" cy="115" r="6" fill="#1A5234"/>
  <circle cx="110" cy="115" r="6" fill="#1A5234"/>
  
  <!-- Eye shine - Brighter -->
  <circle cx="92" cy="113" r="3" fill="#FFFFFF"/>
  <circle cx="112" cy="113" r="3" fill="#FFFFFF"/>
  
  <!-- Big Smile -->
  <path d="M 82 128 Q 100 140 118 128" stroke="#1A5234" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Energy particles -->
  <circle cx="50" cy="70" r="2" fill="#2ECC71" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="70" r="2" fill="#2ECC71" opacity="0.7">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="80" r="2" fill="#2ECC71" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Ground shadow -->
  <ellipse cx="100" cy="195" rx="42" ry="5" fill="rgba(46,204,113,0.2)"/>
</svg>
