<!-- Branchy - Blue State (Focused/Professional) -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Glow effect -->
  <defs>
    <filter id="blueGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="blueGradient">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Body (Tree Trunk) - Professional -->
  <ellipse cx="100" cy="120" rx="35" ry="45" fill="url(#blueGradient)" stroke="#21618C" stroke-width="2"/>
  
  <!-- Branch 1 (Top Left) - Organized -->
  <path d="M 75 95 Q 50 85 40 70" stroke="#2980B9" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="40" cy="70" r="9" fill="#3498DB"/>
  
  <!-- Branch 2 (Top Right) - Organized -->
  <path d="M 125 95 Q 150 85 160 70" stroke="#2980B9" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="160" cy="70" r="9" fill="#3498DB"/>
  
  <!-- Branch 3 (Middle Left) - Symmetrical -->
  <path d="M 70 115 Q 40 110 25 105" stroke="#2980B9" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="25" cy="105" r="7" fill="#3498DB"/>
  
  <!-- Branch 4 (Middle Right) - Symmetrical -->
  <path d="M 130 115 Q 160 110 175 105" stroke="#2980B9" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="175" cy="105" r="7" fill="#3498DB"/>
  
  <!-- Branch 5 (Bottom) - Grounded -->
  <path d="M 100 155 Q 100 175 100 185" stroke="#2980B9" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="100" cy="185" r="7" fill="#3498DB"/>
  
  <!-- Face - Focused/Determined -->
  <!-- Eyes - Focused -->
  <ellipse cx="90" cy="115" rx="5" ry="6" fill="#154360"/>
  <ellipse cx="110" cy="115" rx="5" ry="6" fill="#154360"/>
  
  <!-- Eye shine -->
  <circle cx="91" cy="113" r="2" fill="#FFFFFF"/>
  <circle cx="111" cy="113" r="2" fill="#FFFFFF"/>
  
  <!-- Confident smile -->
  <path d="M 85 130 Q 100 136 115 130" stroke="#154360" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Professional "glasses" effect (optional) -->
  <circle cx="90" cy="115" r="10" fill="none" stroke="#2980B9" stroke-width="1" opacity="0.3"/>
  <circle cx="110" cy="115" r="10" fill="none" stroke="#2980B9" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="115" x2="100" y2="115" stroke="#2980B9" stroke-width="1" opacity="0.3"/>
  
  <!-- Focus indicator - small pulse -->
  <circle cx="100" cy="80" r="4" fill="none" stroke="#3498DB" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Grid pattern for organization -->
  <g opacity="0.15">
    <line x1="50" y1="60" x2="150" y2="60" stroke="#2980B9" stroke-width="0.5"/>
    <line x1="50" y1="100" x2="150" y2="100" stroke="#2980B9" stroke-width="0.5"/>
    <line x1="50" y1="140" x2="150" y2="140" stroke="#2980B9" stroke-width="0.5"/>
    <line x1="70" y1="50" x2="70" y2="150" stroke="#2980B9" stroke-width="0.5"/>
    <line x1="100" y1="50" x2="100" y2="150" stroke="#2980B9" stroke-width="0.5"/>
    <line x1="130" y1="50" x2="130" y2="150" stroke="#2980B9" stroke-width="0.5"/>
  </g>
  
  <!-- Ground shadow -->
  <ellipse cx="100" cy="195" rx="40" ry="5" fill="rgba(52,152,219,0.2)"/>
</svg>
