<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clawdbot Canvas with RGY Side Panel</title>
  
  <!-- Original Canvas Styles -->
  <style>
    html, body { 
      height: 100%; 
      margin: 0; 
      background: #000; 
      color: #fff; 
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif; 
    }
    .wrap { 
      height: 100%; 
      display: grid; 
      place-items: center; 
      padding: 24px;
      margin-right: 380px; /* Make room for side panel */
      transition: margin-right 0.3s ease;
    }
    .card { 
      width: min(720px, 100%); 
      background: rgba(255,255,255,0.06); 
      border: 1px solid rgba(255,255,255,0.10); 
      border-radius: 16px; 
      padding: 18px 18px 14px; 
    }
    .title { 
      display: flex; 
      align-items: baseline; 
      gap: 10px; 
    }
    h1 { 
      margin: 0; 
      font-size: 22px; 
      letter-spacing: 0.2px; 
    }
    .sub { 
      opacity: 0.75; 
      font-size: 13px; 
    }
    .row { 
      display: flex; 
      gap: 10px; 
      flex-wrap: wrap; 
      margin-top: 14px; 
    }
    button { 
      appearance: none; 
      border: 1px solid rgba(255,255,255,0.14); 
      background: rgba(255,255,255,0.10); 
      color: #fff; 
      padding: 10px 12px; 
      border-radius: 12px; 
      font-weight: 600; 
      cursor: pointer; 
    }
    button:active { 
      transform: translateY(1px); 
    }
    .ok { 
      color: #24e08a; 
    }
    .bad { 
      color: #ff5c5c; 
    }
    .log { 
      margin-top: 14px; 
      opacity: 0.85; 
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; 
      white-space: pre-wrap; 
      background: rgba(0,0,0,0.35); 
      border: 1px solid rgba(255,255,255,0.08); 
      padding: 10px; 
      border-radius: 12px; 
    }
    
    /* Panel toggle button */
    .panel-toggle {
      position: fixed;
      top: 20px;
      right: 400px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      z-index: 1001;
      transition: right 0.3s ease;
    }
    
    .panel-toggle:hover {
      background: rgba(255,255,255,0.18);
    }
    
    .panel-hidden .wrap {
      margin-right: 0;
    }
    
    .panel-hidden .panel-toggle {
      right: 20px;
    }
    
    @media (max-width: 1200px) {
      .wrap {
        margin-right: 0;
      }
      .panel-toggle {
        display: none;
      }
    }
  </style>
  
  <!-- Side Panel Styles -->
  <link rel="stylesheet" href="side-panel.css">
</head>
<body>
  <button class="panel-toggle" onclick="togglePanel()">
    <span id="toggle-text">Hide Panel</span>
  </button>

  <div class="wrap">
    <div class="card">
      <div class="title">
        <h1>Clawdbot Canvas + RGY Panel</h1>
        <div class="sub">Interactive test with keywords panel</div>
      </div>

      <div class="row">
        <button id="btn-hello">Hello</button>
        <button id="btn-time">Time</button>
        <button id="btn-photo">Photo</button>
        <button id="btn-dalek">Dalek</button>
        <button id="btn-keywords">Log Keywords</button>
      </div>

      <div id="status" class="sub" style="margin-top: 10px;"></div>
      <div id="log" class="log">Ready. Click "Log Keywords" to see current RGY keywords.</div>
    </div>
  </div>

  <!-- Side Panel Container -->
  <div id="rgy-side-panel" class="side-panel"></div>

  <!-- Side Panel Script -->
  <script src="side-panel-component.js"></script>
  
  <!-- Original Canvas Script + Integration -->
  <script>
    (() => {
      const logEl = document.getElementById("log");
      const statusEl = document.getElementById("status");
      const log = (msg) => { logEl.textContent = String(msg); };

      const hasIOS = () => !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.clawdbotCanvasA2UIAction);
      const hasAndroid = () => !!(window.clawdbotCanvasA2UIAction && typeof window.clawdbotCanvasA2UIAction.postMessage === "function");
      const hasHelper = () => typeof window.clawdbotSendUserAction === "function";
      
      statusEl.innerHTML =
        "Bridge: " +
        (hasHelper() ? "<span class='ok'>ready</span>" : "<span class='bad'>missing</span>") +
        " · iOS=" + (hasIOS() ? "yes" : "no") +
        " · Android=" + (hasAndroid() ? "yes" : "no") +
        " · RGY Panel: <span class='ok'>active</span>";

      window.addEventListener("clawdbot:a2ui-action-status", (ev) => {
        const d = ev && ev.detail || {};
        log("Action status: id=" + (d.id || "?") + " ok=" + String(!!d.ok) + (d.error ? (" error=" + d.error) : ""));
      });

      function send(name, sourceComponentId) {
        if (!hasHelper()) {
          log("No action bridge found. Ensure you're viewing this on an iOS/Android Clawdbot node canvas.");
          return;
        }
        const ok = window.clawdbotSendUserAction({
          name,
          surfaceId: "main",
          sourceComponentId,
          context: { t: Date.now() },
        });
        log(ok ? ("Sent action: " + name) : ("Failed to send action: " + name));
      }

      document.getElementById("btn-hello").onclick = () => send("hello", "demo.hello");
      document.getElementById("btn-time").onclick = () => send("time", "demo.time");
      document.getElementById("btn-photo").onclick = () => send("photo", "demo.photo");
      document.getElementById("btn-dalek").onclick = () => send("dalek", "demo.dalek");

      // Initialize RGY Side Panel
      const sidePanel = new RGYSidePanel('rgy-side-panel', {
        defaultKeywords: {
          red: ['dating', 'romance', 'nightlife'],
          yellow: ['friends', 'hangout', 'coffee', 'movies', 'hiking'],
          green: ['networking', 'freelance', 'IT development', 'wellness', 'coding']
        },
        onKeywordAdd: (color, keyword) => {
          log(`✓ Added "${keyword}" to ${color.toUpperCase()} zone`);
          console.log(`Keyword added to ${color}:`, keyword);
        },
        onKeywordRemove: (color, keyword) => {
          log(`✗ Removed "${keyword}" from ${color.toUpperCase()} zone`);
          console.log(`Keyword removed from ${color}:`, keyword);
        },
        onKeywordsChange: (allKeywords) => {
          console.log('All keywords updated:', allKeywords);
          // Here you would typically send to backend:
          // fetch('/api/user/keywords', { method: 'POST', body: JSON.stringify(allKeywords) });
        }
      });

      // Log Keywords button
      document.getElementById("btn-keywords").onclick = () => {
        const keywords = sidePanel.getAllKeywords();
        log(
          "Current Keywords:\n" +
          "RED: " + keywords.red.join(", ") + "\n" +
          "YELLOW: " + keywords.yellow.join(", ") + "\n" +
          "GREEN: " + keywords.green.join(", ")
        );
      };

      // Store sidePanel globally for debugging
      window.sidePanel = sidePanel;
    })();

    // Panel toggle functionality
    function togglePanel() {
      const body = document.body;
      const toggleText = document.getElementById('toggle-text');
      const isHidden = body.classList.toggle('panel-hidden');
      toggleText.textContent = isHidden ? 'Show Panel' : 'Hide Panel';
    }
  </script>
</body>
</html>
